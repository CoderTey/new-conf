[main]
font=monospace:size=11
dpi-aware=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=0.85
# Nord Theme Palette
foreground=d8dee9
background=2e3440

# Исправленная настройка курсора (теперь здесь)
# формат: <цвет текста под курсором> <цвет самого курсора>
cursor=2e3440 d8dee9

## Normal/regular colors
regular0=3b4252
regular1=bf616a
regular2=a3be8c
regular3=ebcb8b
regular4=81a1c1
regular5=b48ead
regular6=88c0d0
regular7=e5e9f0

## Bright colors
bright0=4c566a
bright1=bf616a
bright2=a3be8c
bright3=ebcb8b
bright4=81a1c1
bright5=b48ead
bright6=8fbcbb
bright7=eceff4

[cursor]
style=block
blink=yes

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[bell]
urgent=no
notify=no
visual=no
